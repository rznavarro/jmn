          "name": "¿Por qué se producen filtraciones en el techo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La causa más común es la fatiga del material, cuando este cumple su vida útil. Otra causa frecuente es una mala construcción o instalación de la techumbre."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué techo puedo instalar en mi casa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Depende de la pendiente del techo. El fabricante define la pendiente mínima de cada material para evitar filtraciones: por ejemplo, la cubierta emballetada sirve para pendientes menores al 5% y la teja asfáltica funciona mejor sobre el 30%. Evaluamos tu techo y te recomendamos la opción adecuada."
          }
        },
        {
          "@type": "Question",
          "name": "¿Por qué se tapan las canaletas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Suele pasar cuando la canaleta no tiene el tamaño adecuado para los metros cuadrados del techo, o cuando las boquillas y los codos de las bajadas de agua son muy pequeños y retienen hojas y basura."
          }
        }
      ]
